services:
  keto:
    image: oryd/keto:v25.4.0
    ports:
      - "4466:4466"  # Read API
      - "4467:4467"  # Write API
    expose:
      - 4466
      - 4467
    volumes:
      - ./keto.yaml:/etc/keto/keto.yaml:ro
      - ./permissions/${PERMISSION_TYPE:-group-direct-permission}/namespaces.keto.ts:/etc/keto/namespaces.keto.ts:ro
      - ./permissions/${PERMISSION_TYPE:-group-direct-permission}/relationships.json:/etc/keto/relationships.json:ro
      - ./startup.sh:/etc/keto/startup.sh:ro
    entrypoint: ["/bin/sh"]
    command: ["/etc/keto/startup.sh"]
    develop:
      watch:
        - action: sync+restart
          path: ./keto.yaml
          target: /etc/keto/keto.yaml
        - action: sync+restart
          path: ./permissions
          target: /etc/keto/
          ignore:
            - "**/*.md"

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4466/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

